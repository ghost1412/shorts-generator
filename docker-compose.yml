services:
  shortsflow:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: shortsflow-ai-studio
    ports:
      - "7860:7860"   # Browser WebUI (webui.py)
    env_file:
      - path: .env
        required: false
    volumes:
      - ./assets:/app/assets
      - ./music:/app/music
      - ./sessions:/app/sessions
    restart: unless-stopped
