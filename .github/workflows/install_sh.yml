name: install.sh (Mac and Linux)

on:
  push:
    paths: ["install.sh", ".github/workflows/install_sh.yml"]
  workflow_dispatch:

jobs:
  install:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install FFmpeg
        run: |
          apt() { for i in 1 2 3 4; do sudo apt-get -o Acquire::Retries=5 "$@" && return 0; echo "apt-get failed ($i/4), retrying in 30 s"; sleep 30; done; return 1; }
          if [ "$(uname)" = "Darwin" ]; then brew install ffmpeg; else apt update && apt install -y ffmpeg; fi
      - name: Run the installer (base package only, to keep it quick)
        run: SHORTSFLOW_EXTRA="" sh install.sh
      - name: The command works
        run: ~/.local/bin/shortsflow doctor || ~/.local/bin/shortsflow --help
