name: UI screenshots

# Opens the browser app in a real browser against a canned finished run, checks the review screen works, and uploads screenshots.
on:
  workflow_dispatch:
  push:
    paths:
      - "webui.py"
      - "shortsflow/review.py"
      - "shortsflow/onboarding.py"
      - "shortsflow/web_args.py"
      - "shortsflow/word_edit.py"
      - "scripts/ui_screenshots.py"
      - ".github/workflows/ui_screenshots.yml"

jobs:
  shots:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        gradio: ["gradio>=5,<6", "gradio>=6,<7"]     # the Docker image pins 5.x, pip installs get 6.x
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "${{ matrix.gradio }}" python-dotenv requests imageio-ffmpeg playwright
      - name: Install Chromium (apt mirrors on the runner are flaky: retry, then fall back to the browser alone)
        run: |
          for i in 1 2 3; do python -m playwright install --with-deps chromium && exit 0; sleep 20; done
          python -m playwright install chromium
      - run: python scripts/ui_screenshots.py ui-screenshots
      - uses: actions/upload-artifact@v4
        with:
          name: ui-screenshots-${{ strategy.job-index }}
          path: ui-screenshots/*.png
