name: Daily Short Generator

on:
  schedule:
    - cron: '0 */4 * * *' # Every 4 hours
  workflow_dispatch:
    inputs:
      mode:
        description: 'Generation Mode (FACTS, STORY, FIND_IT, WYR, REDDIT, TRIVIA, QUOTE, ODD_ONE_OUT)'
        required: false
        default: 'AUTO'
      category:
        description: 'Specific Category'
        required: false
        default: 'random'
      custom_script:
        description: 'Manual Script Content'
        required: false
        default: ''
      vibe:
        description: 'Music Vibe (suspense, spooky, cinematic, upbeat)'
        required: false
        default: 'suspense'
      user_id:
        description: 'Supabase User ID'
        required: false
        default: ''
      video_id:
        description: 'Unique Video/Job ID'
        required: false
        default: ''

jobs:
  generate-and-post:
    runs-on: ${{ github.event_name == 'workflow_dispatch' && 'self-hosted' || 'ubuntu-latest' }}
    # Note: Using self-hosted for manual triggers, ubuntu-latest for cron fallback
    defaults:
      run:
        shell: bash

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Cache dependencies and media
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/pip
          assets/
        key: ${{ runner.os }}-shorts-${{ hashFiles('**/requirements.txt') }}-${{ github.run_id }}
        restore-keys: |
          ${{ runner.os }}-shorts-${{ hashFiles('**/requirements.txt') }}-
          ${{ runner.os }}-shorts-

    - name: Install FFmpeg
      run: |
        if [ "$RUNNER_OS" == "Linux" ]; then
          sudo apt-get update
          sudo apt-get install -y ffmpeg
        else
          ffmpeg -version || echo "FFmpeg should be pre-installed on self-hosted Windows"
        fi

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then
           pip install -r requirements.txt
        fi

    - name: Setup Environment Variables
      run: |
        echo "HF_API_KEY=${{ secrets.HF_API_KEY }}" >> .env
        echo "PEXELS_API_KEY=${{ secrets.PEXELS_API_KEY }}" >> .env
        echo "FACEBOOK_PAGE_ID=${{ secrets.FACEBOOK_PAGE_ID }}" >> .env
        echo "INSTAGRAM_ACCESS_TOKEN=${{ secrets.INSTAGRAM_ACCESS_TOKEN }}" >> .env
        echo '${{ secrets.GOOGLE_YOUTUBE_TOKEN }}' > token.json

    - name: Setup Google Client Secrets
      run: |
        echo '${{ secrets.GOOGLE_CLIENT_SECRETS }}' > client_secrets.json

    - name: Run Video Generator (SaaS Bridge)
      env:
        DASHBOARD_WEBHOOK_URL: ${{ secrets.DASHBOARD_WEBHOOK_URL || 'https://shorts-generator.vercel.app/api/webhook/github' }}
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        USER_ID: ${{ github.event.inputs.user_id }}
        ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
      run: |
        # Decide Mode
        INPUT_MODE="${{ github.event.inputs.mode }}"
        if [ "$INPUT_MODE" != "" ] && [ "$INPUT_MODE" != "AUTO" ]; then
          ARG_MODE="--mode $INPUT_MODE"
        else
          ARG_MODE="--mode AUTO"
        fi

        # Decide Category
        INPUT_CAT="${{ github.event.inputs.category }}"
        if [ "$INPUT_CAT" != "" ] && [ "$INPUT_CAT" != "random" ]; then
          ARG_CAT="--category $INPUT_CAT"
        else
          ARG_CAT=""
        fi

        # Decide Script
        INPUT_SCRIPT="${{ github.event.inputs.custom_script }}"
        if [ "$INPUT_SCRIPT" != "" ]; then
          ARG_SCRIPT="--script '$INPUT_SCRIPT'"
        else
          ARG_SCRIPT=""
        fi

        # Decide Vibe
        INPUT_VIBE="${{ github.event.inputs.vibe }}"
        if [ "$INPUT_VIBE" != "" ]; then
          ARG_VIBE="--vibe $INPUT_VIBE"
        else
          ARG_VIBE=""
        fi

        # Decide User ID
        INPUT_USER_ID="${{ github.event.inputs.user_id }}"
        if [ "$INPUT_USER_ID" != "" ]; then
          ARG_USER_ID="--user_id $INPUT_USER_ID"
        else
          ARG_USER_ID=""
        fi

        # Decide Video ID
        INPUT_VIDEO_ID="${{ github.event.inputs.video_id }}"
        if [ "$INPUT_VIDEO_ID" != "" ]; then
          ARG_VIDEO_ID="--video_id $INPUT_VIDEO_ID"
        else
          ARG_VIDEO_ID=""
        fi

        echo "🎬 Generating Video for User $INPUT_USER_ID..."
        python main.py $ARG_MODE $ARG_CAT $ARG_SCRIPT $ARG_VIBE $ARG_USER_ID $ARG_VIDEO_ID
