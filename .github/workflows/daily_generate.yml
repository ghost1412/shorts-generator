name: Daily Short Generator

on:
  schedule:
    - cron: '0 */1 * * *' # Every 2 hours (12 videos/day) - The viral sweet spot!
  workflow_dispatch:
    inputs:
      mode:
        description: 'Generation Mode (FACTS or STORY)'
        required: false
        default: 'AUTO'
      category:
        description: 'Specific Category'
        required: false
        default: 'random'
      custom_script:
        description: 'Manual Script Content'
        required: false
        default: ''
      vibe:
        description: 'Music Vibe (suspense, spooky, cinematic, upbeat)'
        required: false
        default: 'suspense'

jobs:
  generate-and-post:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install FFmpeg
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Setup Environment Variables
      run: |
        echo "HF_API_KEY=${{ secrets.HF_API_KEY }}" >> .env
        echo "PEXELS_API_KEY=${{ secrets.PEXELS_API_KEY }}" >> .env
        echo "FACEBOOK_PAGE_ID=${{ secrets.FACEBOOK_PAGE_ID }}" >> .env
        echo "INSTAGRAM_ACCESS_TOKEN=${{ secrets.INSTAGRAM_ACCESS_TOKEN }}" >> .env
        echo '${{ secrets.GOOGLE_YOUTUBE_TOKEN }}' > token.json

    - name: Setup Google Client Secrets
      run: |
        echo '${{ secrets.GOOGLE_CLIENT_SECRETS }}' > client_secrets.json

    - name: Run Video Generator (SaaS Bridge)
      run: |
        # Decide Mode
        INPUT_MODE="${{ github.event.inputs.mode }}"
        if [ "$INPUT_MODE" = "FACTS" ] || [ "$INPUT_MODE" = "STORY" ]; then
          MODE="$INPUT_MODE"
        else
          # Fallback to alternating logic
          RUN_COUNT=${{ github.run_number }}
          if [ $((RUN_COUNT % 2)) -eq 0 ]; then MODE="STORY"; else MODE="FACTS"; fi
        fi
        
        # Decide Category
        INPUT_CAT="${{ github.event.inputs.category }}"
        if [ "$INPUT_CAT" != "" ] && [ "$INPUT_CAT" != "random" ]; then
          ARG_CAT="--category $INPUT_CAT"
        else
          ARG_CAT=""
        fi

        # Decide Script
        INPUT_SCRIPT="${{ github.event.inputs.custom_script }}"
        if [ "$INPUT_SCRIPT" != "" ]; then
          ARG_SCRIPT="--script '$INPUT_SCRIPT'"
        else
          ARG_SCRIPT=""
        fi

        # Decide Vibe
        INPUT_VIBE="${{ github.event.inputs.vibe }}"
        if [ "$INPUT_VIBE" != "" ]; then
          ARG_VIBE="--vibe $INPUT_VIBE"
        else
          ARG_VIBE=""
        fi
        
        echo "🎬 Generating $MODE Video..."
        python main.py --mode $MODE $ARG_CAT $ARG_SCRIPT $ARG_VIBE
