name: Daily Short Generator

on:
  schedule:
    - cron: '0 */2 * * *' # Every 2 hours (12 videos/day) - The viral sweet spot!
  workflow_dispatch:

jobs:
  generate-and-post:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install FFmpeg
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Setup Environment Variables
      run: |
        echo "HF_API_KEY=${{ secrets.HF_API_KEY }}" >> .env
        echo "PEXELS_API_KEY=${{ secrets.PEXELS_API_KEY }}" >> .env
        echo "FACEBOOK_PAGE_ID=${{ secrets.FACEBOOK_PAGE_ID }}" >> .env
        echo "INSTAGRAM_ACCESS_TOKEN=${{ secrets.INSTAGRAM_ACCESS_TOKEN }}" >> .env
        echo '${{ secrets.GOOGLE_YOUTUBE_TOKEN }}' > token.json

    - name: Setup Google Client Secrets
      run: |
        echo '${{ secrets.GOOGLE_CLIENT_SECRETS }}' > client_secrets.json

    - name: Run Video Generator (Alternating Mode)
      run: |
        # Use run_number to alternate (Odd = FACTS, Even = STORY)
        RUN_COUNT=${{ github.run_number }}
        if [ $((RUN_COUNT % 2)) -eq 0 ]; then
          MODE="STORY"
        else
          MODE="FACTS"
        fi
        echo "🎬 Running in $MODE mode..."
        python main.py --mode $MODE
