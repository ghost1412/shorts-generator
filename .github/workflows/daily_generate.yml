name: Daily Short Generator

on:
  schedule:
    - cron: '0 */8 * * *' # Every 4 hours
  workflow_dispatch:
    inputs:
      mode:
        description: 'Generation Mode (FACTS, STORY, FIND_IT, WYR, EMOJI_GUESS, REDDIT, TRIVIA, QUOTE, ODD_ONE_OUT, NEWS, NEWS_SERIOUS, RIDDLE)'
        required: false
        default: 'AUTO'
      category:
        description: 'Specific Category'
        required: false
        default: 'random'
      custom_script:
        description: 'Manual Script Content'
        required: false
        default: ''
      vibe:
        description: 'Music Vibe (suspense, spooky, cinematic, upbeat)'
        required: false
        default: 'suspense'
      user_id:
        description: 'Supabase User ID'
        required: false
        default: ''
      video_id:
        description: 'Unique Video/Job ID'
        required: false
        default: ''
      use_comfy:
        description: 'Use ComfyUI for backgrounds'
        required: false
        default: 'false'
      use_ai_audio:
        description: 'Use ComfyUI for AI Music & SFX'
        required: false
        default: 'false'
      bitrate:
        description: 'Video Bitrate (e.g. 5000k, 12000k)'
        required: false
        default: '12000k'
      preset:
        description: 'FFmpeg Preset'
        required: false
        default: 'medium'
      cartoon:
        description: 'Enable Cartoon Mode'
        required: false
        default: 'false'
      persona:
        description: 'Cartoon Persona (mafia_cat, rabbit, robot, squirrel)'
        required: false
        default: ''
      source_video:
        description: 'Source Video URL for Extraction'
        required: false
        default: ''
      use_remotion:
        description: 'Use Remotion Engine (React dynamic animated captions)'
        required: false
        default: 'true'
      caption_style:
        description: 'Subtitle Preset (HORMOZI, GLOW_BOX, BOUNCE, MINIMAL, AUTO)'
        required: false
        default: 'AUTO'
      youtube_account:
        description: 'YouTube Account Slot (e.g. 1, 2)'
        required: false
        default: '1'
      runner_type:
        description: 'Runner Environment (ubuntu-latest, self-hosted)'
        required: false
        default: 'ubuntu-latest'

jobs:
  generate-and-post:
    runs-on: ${{ github.event.inputs.runner_type != '' && github.event.inputs.runner_type || (github.event_name == 'workflow_dispatch' && 'self-hosted' || 'ubuntu-latest') }}
    # Selectable runner (ubuntu-latest or self-hosted) with fallback

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Set up Node.js (for Remotion React Video Engine)
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install Remotion dependencies
      working-directory: remotion-video
      run: npm install

    - name: Cache dependencies and media
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/pip
          assets/
        key: ${{ runner.os }}-shorts-${{ hashFiles('**/requirements.txt') }}-${{ github.run_id }}
        restore-keys: |
          ${{ runner.os }}-shorts-${{ hashFiles('**/requirements.txt') }}-
          ${{ runner.os }}-shorts-

    - name: Install FFmpeg, Fonts & Chromium dependencies (Linux)
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg libcairo2-dev libpango1.0-dev pkg-config libnss3 libatk-bridge2.0-0 libxcomposite1 libxdamage1 libxrandr2 libgbm1 libasound2* libpangocairo-1.0-0 libgtk-3-0
        # Install MS Core Fonts (Impact, Arial, etc.) non-interactively
        echo "ttf-mscorefonts-installer msttcorefonts/accepted-mscorefonts-eula select true" | sudo debconf-set-selections
        sudo apt-get install -y ttf-mscorefonts-installer

    - name: Verify FFmpeg (Windows)
      if: runner.os == 'Windows'
      run: |
        ffmpeg -version

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Setup Environment Variables (Linux)
      if: runner.os == 'Linux'
      shell: bash
      run: |
        echo "HF_API_KEY=${{ secrets.HF_API_KEY }}" >> .env
        echo "PEXELS_API_KEY=${{ secrets.PEXELS_API_KEY }}" >> .env
        echo "FACEBOOK_PAGE_ID=${{ secrets.FACEBOOK_PAGE_ID }}" >> .env
        echo "INSTAGRAM_ACCESS_TOKEN=${{ secrets.INSTAGRAM_ACCESS_TOKEN }}" >> .env
        echo "YOUTUBE_ACCOUNT=${{ github.event.inputs.youtube_account || '1' }}" >> .env
        
        ACC="${{ github.event.inputs.youtube_account || '1' }}"
        if [ "$ACC" = "2" ] && [ -n "${{ secrets.GOOGLE_YOUTUBE_TOKEN_2 }}" ]; then
          echo '${{ secrets.GOOGLE_YOUTUBE_TOKEN_2 }}' > token.json
        elif [ -n "${{ secrets.GOOGLE_YOUTUBE_TOKEN }}" ]; then
          echo '${{ secrets.GOOGLE_YOUTUBE_TOKEN }}' > token.json
        fi
        
        if [ "$ACC" = "2" ] && [ -n "${{ secrets.GOOGLE_CLIENT_SECRETS_2 }}" ]; then
          echo '${{ secrets.GOOGLE_CLIENT_SECRETS_2 }}' > client_secrets.json
        elif [ -n "${{ secrets.GOOGLE_CLIENT_SECRETS }}" ]; then
          echo '${{ secrets.GOOGLE_CLIENT_SECRETS }}' > client_secrets.json
        fi

    - name: Setup Environment Variables (Windows)
      if: runner.os == 'Windows'
      run: |
        "HF_API_KEY=${{ secrets.HF_API_KEY }}" | Out-File -Append -Encoding ascii .env
        "PEXELS_API_KEY=${{ secrets.PEXELS_API_KEY }}" | Out-File -Append -Encoding ascii .env
        "FACEBOOK_PAGE_ID=${{ secrets.FACEBOOK_PAGE_ID }}" | Out-File -Append -Encoding ascii .env
        "INSTAGRAM_ACCESS_TOKEN=${{ secrets.INSTAGRAM_ACCESS_TOKEN }}" | Out-File -Append -Encoding ascii .env
        "YOUTUBE_ACCOUNT=${{ github.event.inputs.youtube_account || '1' }}" | Out-File -Append -Encoding ascii .env
        
        $acc = if ("${{ github.event.inputs.youtube_account }}" -ne "") { "${{ github.event.inputs.youtube_account }}" } else { "1" }
        if ($acc -eq "2" -and "${{ secrets.GOOGLE_YOUTUBE_TOKEN_2 }}" -ne "") {
          '${{ secrets.GOOGLE_YOUTUBE_TOKEN_2 }}' | Out-File -Encoding ascii token.json
        } elseif ("${{ secrets.GOOGLE_YOUTUBE_TOKEN }}" -ne "") {
          '${{ secrets.GOOGLE_YOUTUBE_TOKEN }}' | Out-File -Encoding ascii token.json
        }
        
        if ($acc -eq "2" -and "${{ secrets.GOOGLE_CLIENT_SECRETS_2 }}" -ne "") {
          '${{ secrets.GOOGLE_CLIENT_SECRETS_2 }}' | Out-File -Encoding ascii client_secrets.json
        } elseif ("${{ secrets.GOOGLE_CLIENT_SECRETS }}" -ne "") {
          '${{ secrets.GOOGLE_CLIENT_SECRETS }}' | Out-File -Encoding ascii client_secrets.json
        }

    - name: Run Video Generator (Windows)
      if: runner.os == 'Windows'
      env:
        DASHBOARD_WEBHOOK_URL: ${{ secrets.DASHBOARD_WEBHOOK_URL || 'https://shorts-generator.vercel.app/api/webhook/github' }}
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        USER_ID: ${{ github.event.inputs.user_id }}
        ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
      run: |
          $skip_upload = if (-not (Test-Path "token.json") -or (Get-Item "token.json").Length -eq 0) { "--skip-upload" } else { "" }
          $use_remotion = if ("${{ github.event.inputs.use_remotion }}" -ne "false") { "--use_remotion" } else { "" }
          $cap_style = if ("${{ github.event.inputs.caption_style }}" -ne "") { "${{ github.event.inputs.caption_style }}" } else { "AUTO" }
          $use_comfy = if ("${{ github.event.inputs.use_comfy }}" -eq "true") { "--use_comfy" } else { "" }
          $use_ai_audio = if ("${{ github.event.inputs.use_ai_audio }}" -eq "true") { "--use_ai_audio" } else { "" }
          $c_flag = if ("${{ github.event.inputs.cartoon }}" -eq "true" -or ("${{ github.event.inputs.mode }}" -like "*NEWS*")) { "--cartoon" } else { "" }
          $p_flag = if ("${{ github.event.inputs.persona }}" -ne "") { "--persona" } else { "" }
          $p_val = if ("${{ github.event.inputs.persona }}" -ne "") { "${{ github.event.inputs.persona }}" } else { "" }
          $s_flag = if ("${{ github.event.inputs.custom_script }}" -ne "") { "--script" } else { "" }
          $s_val = if ("${{ github.event.inputs.custom_script }}" -ne "") { "${{ github.event.inputs.custom_script }}" } else { "" }
          $v_flag = if ("${{ github.event.inputs.source_video }}" -ne "") { "--source_video" } else { "" }
          $v_val = if ("${{ github.event.inputs.source_video }}" -ne "") { "${{ github.event.inputs.source_video }}" } else { "" }
          $u_flag = if ("${{ github.event.inputs.user_id }}" -ne "") { "--user_id" } else { "" }
          $u_val = if ("${{ github.event.inputs.user_id }}" -ne "") { "${{ github.event.inputs.user_id }}" } else { "" }
          $id_flag = if ("${{ github.event.inputs.video_id }}" -ne "") { "--video_id" } else { "" }
          $id_val = if ("${{ github.event.inputs.video_id }}" -ne "") { "${{ github.event.inputs.video_id }}" } else { "" }
          python main.py --mode "${{ github.event.inputs.mode || 'AUTO' }}" --category "${{ github.event.inputs.category || 'history' }}" --vibe "${{ github.event.inputs.vibe || 'suspense' }}" --bitrate "${{ github.event.inputs.bitrate || '12000k' }}" --preset "${{ github.event.inputs.preset || 'medium' }}" --caption_style $cap_style $use_remotion $skip_upload $use_comfy $use_ai_audio $c_flag $p_flag $p_val $s_flag $s_val $v_flag $v_val $u_flag $u_val $id_flag $id_val

    - name: Run Video Generator (Linux)
      if: runner.os == 'Linux'
      shell: bash
      env:
        DASHBOARD_WEBHOOK_URL: ${{ secrets.DASHBOARD_WEBHOOK_URL || 'https://shorts-generator.vercel.app/api/webhook/github' }}
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        USER_ID: ${{ github.event.inputs.user_id }}
        ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
      run: |
        ARG_SKIP_UPLOAD=""
        if [ ! -f "token.json" ] || [ ! -s "token.json" ]; then
          ARG_SKIP_UPLOAD="--skip-upload"
        fi
        ARG_MODE="${{ github.event.inputs.mode && github.event.inputs.mode != 'AUTO' && format('--mode {0}', github.event.inputs.mode) || '--mode AUTO' }}"
        ARG_CAT="${{ github.event.inputs.category && github.event.inputs.category != 'random' && format('--category {0}', github.event.inputs.category) || '' }}"
        ARG_VIBE="${{ github.event.inputs.vibe && github.event.inputs.vibe != 'suspense' && format('--vibe {0}', github.event.inputs.vibe) || '' }}"
        ARG_USER_ID="${{ github.event.inputs.user_id && format('--user_id {0}', github.event.inputs.user_id) || '' }}"
        ARG_VIDEO_ID="${{ github.event.inputs.video_id && format('--video_id {0}', github.event.inputs.video_id) || '' }}"
        ARG_SCRIPT="${{ github.event.inputs.custom_script && format('--script \"{0}\"', github.event.inputs.custom_script) || '' }}"
        ARG_REMOTION="${{ github.event.inputs.use_remotion != 'false' && '--use_remotion' || '' }}"
        ARG_CAPSTYLE="${{ github.event.inputs.caption_style && format('--caption_style {0}', github.event.inputs.caption_style) || '--caption_style AUTO' }}"
        ARG_COMFY="${{ github.event.inputs.use_comfy == 'true' && '--use_comfy' || '' }}"
        ARG_AUDIO="${{ github.event.inputs.use_ai_audio == 'true' && '--use_ai_audio' || '' }}"
        # Auto-enable cartoon for NEWS or NEWS_SERIOUS
        ARG_CARTOON="${{ (github.event.inputs.cartoon == 'true' || contains(github.event.inputs.mode, 'NEWS')) && '--cartoon' || '' }}"
        ARG_PERSONA="${{ github.event.inputs.persona && format('--persona {0}', github.event.inputs.persona) || '' }}"
        ARG_BITRATE="${{ github.event.inputs.bitrate && format('--bitrate {0}', github.event.inputs.bitrate) || '--bitrate 12000k' }}"
        ARG_PRESET="${{ github.event.inputs.preset && format('--preset {0}', github.event.inputs.preset) || '--preset medium' }}"
        ARG_SOURCE_VIDEO="${{ github.event.inputs.source_video && format('--source_video {0}', github.event.inputs.source_video) || '' }}"
        
        python main.py $ARG_MODE $ARG_CAT $ARG_VIBE $ARG_USER_ID $ARG_VIDEO_ID $ARG_SCRIPT $ARG_REMOTION $ARG_CAPSTYLE $ARG_SKIP_UPLOAD $ARG_COMFY $ARG_AUDIO $ARG_CARTOON $ARG_PERSONA $ARG_BITRATE $ARG_PRESET $ARG_SOURCE_VIDEO
