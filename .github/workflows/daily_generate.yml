name: Daily Short Generator

on:
  schedule:
    - cron: '0 */1 * * *' # Every 4 hours
  workflow_dispatch:
    inputs:
      mode:
        description: 'Generation Mode (FACTS, STORY, FIND_IT, WYR, REDDIT, TRIVIA, QUOTE, ODD_ONE_OUT, NEWS, NEWS_SERIOUS)'
        required: false
        default: 'AUTO'
      category:
        description: 'Specific Category'
        required: false
        default: 'random'
      custom_script:
        description: 'Manual Script Content'
        required: false
        default: ''
      vibe:
        description: 'Music Vibe (suspense, spooky, cinematic, upbeat)'
        required: false
        default: 'suspense'
      user_id:
        description: 'Supabase User ID'
        required: false
        default: ''
      video_id:
        description: 'Unique Video/Job ID'
        required: false
        default: ''
      use_comfy:
        description: 'Use ComfyUI for backgrounds'
        required: false
        default: 'false'
      use_ai_audio:
        description: 'Use ComfyUI for AI Music & SFX'
        required: false
        default: 'false'
      bitrate:
        description: 'Video Bitrate (e.g. 5000k, 12000k)'
        required: false
        default: '12000k'
      preset:
        description: 'FFmpeg Preset'
        required: false
        default: 'medium'
      cartoon:
        description: 'Enable Cartoon Mode'
        required: false
        default: 'false'
      persona:
        description: 'Cartoon Persona (mafia_cat, rabbit, robot, squirrel)'
        required: false
        default: 'mafia_cat'

jobs:
  generate-and-post:
    runs-on: ${{ github.event_name == 'workflow_dispatch' && 'self-hosted' || 'ubuntu-latest' }}
    # Note: Using self-hosted for manual triggers, ubuntu-latest for cron fallback

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Cache dependencies and media
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/pip
          assets/
        key: ${{ runner.os }}-shorts-${{ hashFiles('**/requirements.txt') }}-${{ github.run_id }}
        restore-keys: |
          ${{ runner.os }}-shorts-${{ hashFiles('**/requirements.txt') }}-
          ${{ runner.os }}-shorts-

    - name: Install FFmpeg & Fonts (Linux)
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg
        # Install MS Core Fonts (Impact, Arial, etc.) non-interactively
        echo "ttf-mscorefonts-installer msttcorefonts/accepted-mscorefonts-eula select true" | sudo debconf-set-selections
        sudo apt-get install -y ttf-mscorefonts-installer

    - name: Verify FFmpeg (Windows)
      if: runner.os == 'Windows'
      run: |
        ffmpeg -version

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Setup Environment Variables (Linux)
      if: runner.os == 'Linux'
      shell: bash
      run: |
        echo "HF_API_KEY=${{ secrets.HF_API_KEY }}" >> .env
        echo "PEXELS_API_KEY=${{ secrets.PEXELS_API_KEY }}" >> .env
        echo "FACEBOOK_PAGE_ID=${{ secrets.FACEBOOK_PAGE_ID }}" >> .env
        echo "INSTAGRAM_ACCESS_TOKEN=${{ secrets.INSTAGRAM_ACCESS_TOKEN }}" >> .env
        echo '${{ secrets.GOOGLE_YOUTUBE_TOKEN }}' > token.json
        echo '${{ secrets.GOOGLE_CLIENT_SECRETS }}' > client_secrets.json

    - name: Setup Environment Variables (Windows)
      if: runner.os == 'Windows'
      run: |
        "HF_API_KEY=${{ secrets.HF_API_KEY }}" | Out-File -Append -Encoding ascii .env
        "PEXELS_API_KEY=${{ secrets.PEXELS_API_KEY }}" | Out-File -Append -Encoding ascii .env
        "FACEBOOK_PAGE_ID=${{ secrets.FACEBOOK_PAGE_ID }}" | Out-File -Append -Encoding ascii .env
        "INSTAGRAM_ACCESS_TOKEN=${{ secrets.INSTAGRAM_ACCESS_TOKEN }}" | Out-File -Append -Encoding ascii .env
        '${{ secrets.GOOGLE_YOUTUBE_TOKEN }}' | Out-File -Encoding ascii token.json
        '${{ secrets.GOOGLE_CLIENT_SECRETS }}' | Out-File -Encoding ascii client_secrets.json

    - name: Run Video Generator (Windows)
      if: runner.os == 'Windows'
      env:
        DASHBOARD_WEBHOOK_URL: ${{ secrets.DASHBOARD_WEBHOOK_URL || 'https://shorts-generator.vercel.app/api/webhook/github' }}
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        USER_ID: ${{ github.event.inputs.user_id }}
        ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
      run: |
          $use_comfy = if ("${{ github.event.inputs.use_comfy }}" -eq "true") { "--use_comfy" } else { "" }
          $use_ai_audio = if ("${{ github.event.inputs.use_ai_audio }}" -eq "true") { "--use_ai_audio" } else { "" }
          $c_flag = if ("${{ github.event.inputs.cartoon }}" -eq "true" -or ("${{ github.event.inputs.mode }}" -like "*NEWS*")) { "--cartoon" } else { "" }
          $p_flag = if ("${{ github.event.inputs.persona }}" -ne "") { "--persona" } else { "" }
          $p_val = if ("${{ github.event.inputs.persona }}" -ne "") { "${{ github.event.inputs.persona }}" } else { "" }
          $s_flag = if ("${{ github.event.inputs.custom_script }}" -ne "") { "--script" } else { "" }
          $s_val = if ("${{ github.event.inputs.custom_script }}" -ne "") { "${{ github.event.inputs.custom_script }}" } else { "" }
          python main.py --mode "${{ github.event.inputs.mode || 'AUTO' }}" --category "${{ github.event.inputs.category || 'history' }}" --vibe "${{ github.event.inputs.vibe || 'suspense' }}" --user_id "${{ github.event.inputs.user_id }}" --video_id "${{ github.event.inputs.video_id }}" --bitrate "${{ github.event.inputs.bitrate || '12000k' }}" --preset "${{ github.event.inputs.preset || 'medium' }}" $use_comfy $use_ai_audio $c_flag $p_flag $p_val $s_flag $s_val

    - name: Run Video Generator (Linux)
      if: runner.os == 'Linux'
      shell: bash
      env:
        DASHBOARD_WEBHOOK_URL: ${{ secrets.DASHBOARD_WEBHOOK_URL || 'https://shorts-generator.vercel.app/api/webhook/github' }}
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        USER_ID: ${{ github.event.inputs.user_id }}
        ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
      run: |
        ARG_MODE="${{ github.event.inputs.mode && github.event.inputs.mode != 'AUTO' && format('--mode {0}', github.event.inputs.mode) || '--mode AUTO' }}"
        ARG_CAT="${{ github.event.inputs.category && github.event.inputs.category != 'random' && format('--category {0}', github.event.inputs.category) || '' }}"
        ARG_VIBE="${{ github.event.inputs.vibe && github.event.inputs.vibe != 'suspense' && format('--vibe {0}', github.event.inputs.vibe) || '' }}"
        ARG_USER_ID="${{ github.event.inputs.user_id && format('--user_id {0}', github.event.inputs.user_id) || '' }}"
        ARG_VIDEO_ID="${{ github.event.inputs.video_id && format('--video_id {0}', github.event.inputs.video_id) || '' }}"
        ARG_SCRIPT="${{ github.event.inputs.custom_script && format('--script \"{0}\"', github.event.inputs.custom_script) || '' }}"
        ARG_COMFY="${{ github.event.inputs.use_comfy == 'true' && '--use_comfy' || '' }}"
        ARG_AUDIO="${{ github.event.inputs.use_ai_audio == 'true' && '--use_ai_audio' || '' }}"
        # Auto-enable cartoon for NEWS or NEWS_SERIOUS
        ARG_CARTOON="${{ (github.event.inputs.cartoon == 'true' || contains(github.event.inputs.mode, 'NEWS')) && '--cartoon' || '' }}"
        ARG_PERSONA="${{ github.event.inputs.persona && format('--persona {0}', github.event.inputs.persona) || '' }}"
        ARG_BITRATE="${{ github.event.inputs.bitrate && format('--bitrate {0}', github.event.inputs.bitrate) || '--bitrate 12000k' }}"
        ARG_PRESET="${{ github.event.inputs.preset && format('--preset {0}', github.event.inputs.preset) || '--preset medium' }}"
        
        python main.py $ARG_MODE $ARG_CAT $ARG_VIBE $ARG_USER_ID $ARG_VIDEO_ID $ARG_SCRIPT $ARG_COMFY $ARG_AUDIO $ARG_CARTOON $ARG_PERSONA $ARG_BITRATE $ARG_PRESET
