name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: System libraries (Pango/Cairo for manim)
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev libpango1.0-dev pkg-config ffmpeg
          echo "PKG_CONFIG_PATH=/usr/lib/x86_64-linux-gnu/pkgconfig:/usr/share/pkgconfig" >> $GITHUB_ENV

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint (syntax errors and undefined names only)
        run: |
          pip install flake8
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --exclude=.git,web,remotion-video,scratch,sessions

      - name: Compile all Python
        run: python -m compileall -q main.py webui.py mcp_server.py server.py engine shortsflow tests

      - name: Pytest
        run: python -m pytest -q

      - name: Build wheel and check the bundled data
        run: |
          pip install build
          python -m build --wheel --outdir dist-check
          python - <<'EOF'
          import glob, zipfile
          names = zipfile.ZipFile(glob.glob("dist-check/*.whl")[0]).namelist()
          for needed in ("shortsflow/cli.py", "engine/speaker_focus.py", "shortsflow/_bundle/remotion-video/src/ShortFlow.tsx",
                         "shortsflow/_bundle/assets/models/face_detection_yunet_2023mar.onnx", "shortsflow/api/app.py"):
              assert needed in names, f"missing from wheel: {needed}"
          assert not any("node_modules" in n for n in names), "node_modules leaked into the wheel"
          print(len(names), "files OK")
          EOF

  remotion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: remotion-video/package-lock.json
      - name: Install
        working-directory: remotion-video
        run: npm ci
      - name: Type-check
        working-directory: remotion-video
        run: npx tsc --noEmit -p .
