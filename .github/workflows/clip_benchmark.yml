name: Clip Benchmark

# Manually benchmarks clip quality on a long public-domain video, so heavy runs
# happen on GitHub's runners instead of the owner's PC. No API keys needed.

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'Long public-domain video to clip (direct file URL)'
        required: false
        default: 'https://upload.wikimedia.org/wikipedia/commons/7/73/NASA_Astronaut_Don_Pettit_Talks_with_Neil_deGrasse_Tyson%E2%80%99s_%E2%80%9CStar_Talk%E2%80%9D_%E2%80%93_April_3%2C_2025_%28iss072m260931539%29.webm'
      clip_count:
        description: 'Number of clips to extract (shorts mode)'
        required: false
        default: '5'
      mode:
        description: 'shorts (vertical clips) or long (one highlights video)'
        required: false
        default: 'shorts'
        type: choice
        options: ['shorts', 'long']
      reel_seconds:
        description: 'Target length of the highlights video in seconds (long mode)'
        required: false
        default: '180'

concurrency:
  group: clip-benchmark-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: System packages (FFmpeg, Pango/Cairo)
        run: |
          apt() { for i in 1 2 3 4; do sudo apt-get -o Acquire::Retries=5 "$@" && return 0; echo "apt-get failed ($i/4), retrying in 30 s"; sleep 30; done; return 1; }
          apt update
          apt install -y ffmpeg libcairo2-dev libpango1.0-dev pkg-config libglib2.0-dev
          echo "PKG_CONFIG_PATH=/usr/lib/x86_64-linux-gnu/pkgconfig:/usr/share/pkgconfig" >> $GITHUB_ENV

      - name: Install
        run: |
          python -m pip install --upgrade pip
          # CPU torch first (the default wheel pulls in CUDA, several GB the runner cannot use), then the clip extras
          pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt -e ".[clip]"

      - name: Download video
        env:
          VIDEO_URL: ${{ github.event.inputs.video_url }}
        run: |
          curl -fL --retry 3 -A "ShortsFlow-benchmark/1.0" -o video.webm "$VIDEO_URL"
          ls -lh video.webm

      - name: Extract clips (no upload)
        env:
          SHORTSFLOW_WHISPER_MODEL: base
          CLIP_COUNT: ${{ github.event.inputs.clip_count || '5' }}
          MODE: ${{ github.event.inputs.mode || 'shorts' }}
          REEL_SECONDS: ${{ github.event.inputs.reel_seconds || '180' }}
        run: |
          if [ "$MODE" = "long" ]; then
            python main.py --source_video video.webm --extract_mode long --target_duration "$REEL_SECONDS" \
              --skip-upload --session_dir bench --output_json bench/results.json
          else
            python main.py --source_video video.webm --extract_mode shorts --clip_count "$CLIP_COUNT" \
              --target_duration 30 --min_duration 18 --smart_crop --tighten --layout auto \
              --skip-upload --session_dir bench --output_json bench/results.json
          fi

      - name: Benchmark report
        env:
          MODE: ${{ github.event.inputs.mode || 'shorts' }}
        run: |
          if [ "$MODE" = "long" ]; then
            python scripts/clip_benchmark.py bench --json bench/report.json
          else
            python scripts/clip_benchmark.py bench --picture --json bench/report.json
          fi

      - name: Job summary
        if: always()
        run: |
          {
            echo "## Clip benchmark"
            echo
            if [ -f bench/report.json ]; then
              echo '```json'
              cat bench/report.json
              echo '```'
            else
              echo "No report produced."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Sample frames (to look at the crop)
        if: always()
        run: |
          mkdir -p bench/frames
          i=0
          python -c "import json; print(*[c['video_path'] for c in json.load(open('bench/results.json'))['clips'][:3] if c.get('video_path')], sep=chr(10))" 2>/dev/null | while IFS= read -r f; do
            i=$((i+1)); ffmpeg -y -loglevel error -ss 5 -i "$f" -frames:v 1 -vf scale=360:-2 "bench/frames/clip$i.png" < /dev/null || true
          done
          ls bench/frames || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: clip-benchmark
          path: |
            bench/report.json
            bench/results.json
            bench/transcript.json
            bench/frames/*.png
          if-no-files-found: warn
          retention-days: 14
