name: Daily channel watchdog

# Opens ONE issue (label daily-failing) when the last two scheduled runs of "Daily Short Generator" failed, and closes it when a run
# succeeds again, so an outage of the channel cannot go unnoticed for a day. It only reads workflow runs; it never posts anything.

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Only print what would happen (default true for manual runs)'
        required: false
        default: 'true'

permissions:
  contents: read
  actions: read
  issues: write

jobs:
  watchdog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check the daily runs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DRY: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run != 'false' && '--dry-run' || '' }}
        run: python scripts/daily_watchdog.py --repo "$GITHUB_REPOSITORY" $DRY
