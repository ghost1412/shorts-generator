name: LLM check

# Shows which AI providers answer with the repository secrets (keys are never printed). Runs weekly and fails
# (GitHub emails the owner) when none answers, so a retired model or a dead key is caught before the daily channel fails.
on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          HF_API_KEY: ${{ secrets.HF_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/llm_check.py --strict
