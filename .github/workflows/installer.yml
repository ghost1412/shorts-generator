name: Windows installer

# On a release tag (v*): smoke-test the installer script on a clean Windows runner, wait for that version on PyPI,
# compile the Inno Setup installer and attach it to the GitHub release. Can also be run by hand to check the script.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  installer:
    runs-on: windows-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4

      - name: Version
        id: ver
        shell: pwsh
        run: |
          $v = (Select-String -Path shortsflow/__init__.py -Pattern '__version__\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          "version=$v" >> $env:GITHUB_OUTPUT

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the wheel from this commit
        shell: pwsh
        run: |
          python -m pip install build
          python -m build --wheel --outdir dist-wheel .

      - name: Smoke test - run the installer script on a clean machine (CPU build)
        shell: pwsh
        run: |
          $wheel = (Get-ChildItem dist-wheel/*.whl | Select-Object -First 1).FullName
          ./installer/Install-ShortsFlow.ps1 -InstallDir "$env:RUNNER_TEMP\sf" -Wheel $wheel -Cpu -NoShortcuts
          if ($LASTEXITCODE -ne 0) { throw "installer failed" }
          $env:SHORTSFLOW_HOME = "$env:RUNNER_TEMP\sf\workspace"
          & "$env:RUNNER_TEMP\sf\venv\Scripts\shortsflow.exe" --version
          & "$env:RUNNER_TEMP\sf\venv\Scripts\shortsflow.exe" clip --help
          & "$env:RUNNER_TEMP\sf\venv\Scripts\shortsflow.exe" doctor
          Set-Location $env:RUNNER_TEMP   # not the checkout, or `shortsflow` would import from the repo instead of the install
          & "$env:RUNNER_TEMP\sf\venv\Scripts\python.exe" -c "from shortsflow import webui; print('webui module OK')"
          if ($LASTEXITCODE -ne 0) { throw "installed package has no webui module" }

      - name: End-to-end on a clean Windows PC without an NVIDIA card - make a real short and start the browser app
        shell: pwsh
        run: |
          $sf = "$env:RUNNER_TEMP\sf"
          $env:SHORTSFLOW_HOME = "$sf\workspace"
          $env:SHORTSFLOW_WHISPER_MODEL = "tiny"     # small download, this only proves the pipeline runs
          $env:PATH = "$sf\ffmpeg\bin;$sf\node;$env:PATH"   # what ShortsFlow.cmd does for the desktop shortcut
          if (-not (Test-Path "$sf\ffmpeg\bin\ffprobe.exe")) { throw "the installer did not provide ffprobe" }
          $work = "$env:RUNNER_TEMP\e2e"
          New-Item -ItemType Directory -Force -Path $work | Out-Null
          # a ~30 s video with real speech, made offline with Windows' built-in voice
          Add-Type -AssemblyName System.Speech
          $voice = New-Object System.Speech.Synthesis.SpeechSynthesizer
          $voice.SetOutputToWaveFile("$work\speech.wav")
          $voice.Speak("Welcome to this short demo. Today we explain why the sky looks blue. Sunlight is made of many colors. The blue light scatters the most in the air. That is why you see a blue sky during the day. At sunset the light travels farther, so the red and orange colors reach your eyes. Now you know the secret behind the colors of the sky. Thanks for watching, and see you next time.")
          $voice.Dispose()
          $ff = & "$sf\venv\Scripts\python.exe" -c "import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())"
          & $ff -y -loglevel error -f lavfi -i testsrc2=size=1280x720:rate=25 -i "$work\speech.wav" -shortest -c:v libx264 -pix_fmt yuv420p -c:a aac "$work\sample.mp4"
          if ($LASTEXITCODE -ne 0) { throw "could not build the sample video" }

          & "$sf\venv\Scripts\shortsflow.exe" clip "$work\sample.mp4" --count 1 --session_dir "$work\out"
          if ($LASTEXITCODE -ne 0) { throw "shortsflow clip failed on a PC without an NVIDIA card" }
          $clip = Get-Item "$work\out\video_clip_1.mp4" -ErrorAction Stop
          if ($clip.Length -lt 50000) { throw "the short is suspiciously small ($($clip.Length) bytes)" }
          Write-Host "Short made: $($clip.Length) bytes"

          # the browser app (what the desktop shortcut opens) must come up
          $p = Start-Process -FilePath "$sf\venv\Scripts\shortsflow.exe" -ArgumentList "webui","--port","7861" -PassThru -RedirectStandardOutput "$work\webui.out" -RedirectStandardError "$work\webui.err"
          $ok = $false
          for ($i = 0; $i -lt 60 -and -not $ok; $i++) {
            Start-Sleep -Seconds 2
            try { $ok = (Invoke-WebRequest -Uri "http://127.0.0.1:7861" -UseBasicParsing).StatusCode -eq 200 } catch {}
          }
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          if (-not $ok) { Get-Content "$work\webui.err" -ErrorAction SilentlyContinue | Select-Object -Last 30; throw "the browser app did not start" }
          Write-Host "Browser app answered on port 7861"

      - name: Animated captions on a clean Windows PC (Node + Remotion + Chromium download)
        shell: pwsh
        timeout-minutes: 30
        run: |
          $sf = "$env:RUNNER_TEMP\sf"
          $work = "$env:RUNNER_TEMP\e2e"
          $env:SHORTSFLOW_HOME = "$sf\workspace"
          $env:SHORTSFLOW_WHISPER_MODEL = "tiny"
          $env:PATH = "$sf\ffmpeg\bin;$sf\node;$env:PATH"
          & "$sf\venv\Scripts\shortsflow.exe" clip "$work\sample.mp4" --count 1 --captions --session_dir "$work\out_captions"
          if ($LASTEXITCODE -ne 0) { throw "shortsflow clip --captions failed on a clean PC" }
          $clip = Get-Item "$work\out_captions\video_clip_1.mp4" -ErrorAction Stop
          if ($clip.Length -lt 50000) { throw "the captioned short is suspiciously small ($($clip.Length) bytes)" }
          Write-Host "Captioned short made: $($clip.Length) bytes"

      - name: Wait for this version on PyPI (the installer downloads it from there)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          for ($i = 0; $i -lt 60; $i++) {
            try { Invoke-RestMethod "https://pypi.org/pypi/shortsflow/$v/json" | Out-Null; Write-Host "PyPI has $v"; exit 0 } catch { Start-Sleep -Seconds 30 }
          }
          throw "shortsflow $v never appeared on PyPI"

      - name: Compile the installer
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=${{ steps.ver.outputs.version }}" installer\shortsflow.iss
          Copy-Item "installer\output\ShortsFlow-Setup-${{ steps.ver.outputs.version }}.exe" installer\output\ShortsFlow-Setup.exe   # stable name for releases/latest/download/
          Get-ChildItem installer\output

      - name: Run the real installer (.exe) silently, open the app, then uninstall
        shell: pwsh
        timeout-minutes: 45
        run: |
          $exe = (Get-ChildItem installer\output\ShortsFlow-Setup-*.exe | Select-Object -First 1).FullName
          $dir = "$env:RUNNER_TEMP\sf-exe"
          $inno = "$env:RUNNER_TEMP\inno.log"
          # this step runs in PowerShell 7, whose module path breaks module autoloading in the Windows PowerShell 5.1 the installer
          # starts; a real user's PC has the normal machine path, so use that
          $env:PSModulePath = [Environment]::GetEnvironmentVariable("PSModulePath", "Machine")
          $p = Start-Process -FilePath $exe -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/DIR=`"$dir`"", "/LOG=`"$inno`"" -PassThru
          # poll instead of -Wait so a hang shows where it is stuck (the PowerShell installer logs to install.log)
          $deadline = (Get-Date).AddMinutes(35)
          while (-not $p.HasExited -and (Get-Date) -lt $deadline) {
            Start-Sleep -Seconds 60
            Write-Host "--- installer still running ($([int]((Get-Date) - $p.StartTime).TotalMinutes) min); last install.log lines:"
            if (Test-Path "$dir\install.log") { Get-Content "$dir\install.log" -Tail 4 }
          }
          if (-not $p.HasExited) {
            Write-Host "installer did not finish in 35 minutes"
            if (Test-Path "$dir\install.log") { Get-Content "$dir\install.log" -Tail 80 }
            if (Test-Path $inno) { Get-Content $inno -Tail 60 }
            Get-Process | Where-Object { $_.Path -and $_.Path -like "$dir*" -or $_.ProcessName -match "powershell|pwsh|uv|npm|node" } | Select-Object ProcessName, Id, CPU | Format-Table | Out-String | Write-Host
            throw "the .exe installer hung"
          }
          Write-Host "installer exit code: $($p.ExitCode)"
          if ($p.ExitCode -ne 0 -or -not (Test-Path "$dir\venv\Scripts\shortsflow.exe")) {
            if (Test-Path "$dir\install.log") { Get-Content "$dir\install.log" -Tail 60 }
            if (Test-Path $inno) { Get-Content $inno -Tail 40 }
            throw "the .exe installer did not finish a working install"
          }
          foreach ($f in @("ShortsFlow.cmd", "ffmpeg\bin\ffprobe.exe", "node\node.exe")) {
            if (-not (Test-Path "$dir\$f")) { throw "missing after install: $f" }
          }
          $desktopLink = Join-Path ([Environment]::GetFolderPath("Desktop")) "ShortsFlow.lnk"
          if (-not (Test-Path $desktopLink)) { throw "no Desktop shortcut was created" }
          New-Item -ItemType Directory -Force -Path "$dir\workspace" | Out-Null
          Set-Content "$dir\workspace\my-videos-marker.txt" "keep me"

          # what the shortcut runs: the browser app must come up
          $app = Start-Process -FilePath "cmd.exe" -ArgumentList "/c", "`"$dir\ShortsFlow.cmd`"" -PassThru -WindowStyle Hidden
          $ok = $false
          for ($i = 0; $i -lt 60 -and -not $ok; $i++) {
            Start-Sleep -Seconds 2
            try { $ok = (Invoke-WebRequest -Uri "http://127.0.0.1:7860" -UseBasicParsing).StatusCode -eq 200 } catch {}
          }
          taskkill /PID $app.Id /T /F 2>&1 | Out-Null
          $global:LASTEXITCODE = 0     # taskkill exits non-zero when the process already ended; that must not fail this step
          if (-not $ok) { throw "ShortsFlow.cmd did not bring up the browser app" }
          Write-Host "ShortsFlow.cmd started the browser app"

          # uninstall: program files go, the user's workspace stays
          $un = Get-ChildItem $dir -Filter "unins*.exe" | Select-Object -First 1
          if (-not $un) { throw "no uninstaller was installed" }
          Start-Process -FilePath $un.FullName -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -Wait
          for ($i = 0; $i -lt 60 -and (Test-Path "$dir\venv"); $i++) { Start-Sleep -Seconds 2 }   # Inno's uninstaller hands off to a temp copy
          if (Test-Path "$dir\venv") { throw "uninstall left the Python environment behind" }
          if (-not (Test-Path "$dir\workspace\my-videos-marker.txt")) { throw "uninstall deleted the user's workspace" }
          if (Test-Path $desktopLink) { throw "uninstall left the Desktop shortcut" }
          Write-Host "Uninstall removed the program and kept the workspace"
          exit 0

      - uses: actions/upload-artifact@v4
        with:
          name: ShortsFlow-Setup
          path: installer/output/*.exe

      - name: Attach to the GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) { gh release create $tag --title $tag --generate-notes }
          gh release upload $tag (Get-ChildItem installer\output\*.exe).FullName --clobber
